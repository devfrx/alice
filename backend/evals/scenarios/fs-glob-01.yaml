id: fs-glob-01
title: Trova i file .py annidati con un pattern glob
domain: search
setup:
  sandbox:
    - path: "src/main.py"
      content: "print('main')\n"
    - path: "src/utils/helpers.py"
      content: "def helper():\n    return 42\n"
    - path: "docs/note.txt"
      content: "appunti vari\n"
    - path: "src/style.css"
      content: "body { margin: 0; }\n"
prompt: |-
  Cartella di lavoro: {sandbox}
  Elenca i file Python (.py) presenti nella cartella di lavoro, a
  qualunque profondità.
checks:
  - kind: tool_called
    name: file_search_glob_files
  - kind: response_matches
    pattern: "main\\.py"
  - kind: response_matches
    pattern: "helpers\\.py"
  # Negativi ancorati al PATH (dir + separatore): falliscono solo se la
  # risposta ELENCA il file escluso come risultato, non se lo menziona
  # di passaggio ("ho ignorato note.txt").
  - kind: response_not_matches
    pattern: "docs[/\\\\]note\\.txt"
  - kind: response_not_matches
    pattern: "src[/\\\\]style\\.css"
  - kind: finished_ok
