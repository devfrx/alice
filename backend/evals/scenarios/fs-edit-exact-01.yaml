id: fs-edit-exact-01
title: Modifica esatta di UNA sola tra due righe identiche (disambiguazione)
domain: filesystem
setup:
  sandbox:
    - path: "settings.txt"
      content: |
        [server]
        timeout = 30

        [client]
        timeout = 30
prompt: |-
  Cartella di lavoro: {sandbox}
  Nel file settings.txt le sezioni [server] e [client] contengono entrambe
  la stessa identica riga "timeout = 30". Porta a 60 SOLO il timeout della
  sezione [client], lasciando invariata la sezione [server]. Leggi prima il
  file, poi applica una modifica mirata (non riscrivere l'intero file).
checks:
  - kind: tool_called
    name: file_search_read_text_file
  - kind: tool_called
    name: file_search_edit_text_file
  - kind: file_contains
    path: settings.txt
    text: "[client]\ntimeout = 60"
  - kind: file_contains
    path: settings.txt
    text: "[server]\ntimeout = 30"
  - kind: finished_ok
